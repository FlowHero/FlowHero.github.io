    <!--
      Preloader styles live inline so the overlay paints on the first frame,
      before the CSS bundle or any font has arrived. Everything here is scoped
      under #preloader and the whole node is removed from the DOM once the app
      is up, so none of it can leak into the page.
    -->
    <style>
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #04070a;
        font-family: 'Space Grotesk', ui-sans-serif, system-ui, -apple-system, sans-serif;
        transition:
          opacity 0.6s ease,
          visibility 0.6s;
      }
      #preloader.pl-out {
        opacity: 0;
        visibility: hidden;
        /* `visibility` only flips at the END of its transition, so for the whole
           600ms fade the overlay was invisible but still hit-testable and ate
           every click. Release the pointer the instant the fade starts. */
        pointer-events: none;
      }
      /* Same palette as the hero backdrop, so the fade-out lands on a
         background that already looks like the page underneath it. */
      #preloader .pl-glow {
        position: absolute;
        top: -30%;
        left: 50%;
        width: 120vw;
        height: 70vh;
        transform: translateX(-50%);
        border-radius: 50%;
        background: radial-gradient(ellipse at center, #00a86b 0%, transparent 62%);
        opacity: 0.24;
        filter: blur(80px);
      }
      /* CRT scanlines over the whole overlay. */
      #preloader::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.025) 0px,
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px,
          transparent 4px
        );
      }
      #preloader .pl-inner {
        position: relative;
        width: min(84vw, 22rem);
      }
      #preloader .pl-log {
        margin: 0 0 1.6rem;
        padding: 0;
        list-style: none;
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        line-height: 1.8;
        color: #6f8090;
        white-space: nowrap;
      }
      #preloader .pl-log li {
        opacity: 0;
        animation: pl-line 0.3s steps(2) forwards;
      }
      #preloader .pl-ok {
        color: #00f59b;
      }
      #preloader .pl-run {
        color: #fbbf24;
      }
      @keyframes pl-line {
        to {
          opacity: 1;
        }
      }
      #preloader .pl-name {
        display: flex;
        justify-content: center;
        margin-bottom: 1.6rem;
        font-size: clamp(1.9rem, 7vw, 3rem);
        font-weight: 700;
        letter-spacing: 0.22em;
        text-indent: 0.22em; /* balance the trailing letter-spacing */
        background: linear-gradient(90deg, #34ffb0, #00f59b, #22d3ee);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #preloader .pl-name span {
        opacity: 0;
        animation: pl-letter 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      @keyframes pl-letter {
        from {
          opacity: 0;
          transform: translateY(0.35em);
          filter: blur(6px);
        }
        to {
          opacity: 1;
          transform: none;
          filter: blur(0);
        }
      }
      #preloader .pl-track {
        height: 2px;
        overflow: hidden;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.09);
      }
      #preloader .pl-fill {
        height: 100%;
        transform: scaleX(0);
        transform-origin: left center;
        background: linear-gradient(90deg, #00f59b, #22d3ee);
        box-shadow: 0 0 14px rgba(0, 245, 155, 0.55);
      }
      #preloader .pl-meta {
        display: flex;
        justify-content: space-between;
        margin-top: 0.75rem;
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #6f8090;
      }
      #preloader .pl-pct {
        color: #00f59b;
        font-variant-numeric: tabular-nums;
      }
      @media (prefers-reduced-motion: reduce) {
        #preloader,
        #preloader .pl-name span,
        #preloader .pl-log li {
          animation: none;
          transition-duration: 0.15s;
        }
        #preloader .pl-name span,
        #preloader .pl-log li {
          opacity: 1;
        }
      }
    </style>

    <!-- With JS off the overlay has nothing to dismiss it, and it would cover
         the static copy the build writes into #root. Drop it instead: the page
         is then plain but complete and readable. Must come after the block
         above — same specificity, so document order decides. -->
    <noscript>
      <style>
        #preloader {
          display: none;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="preloader" role="status" aria-live="polite" aria-label="Loading portfolio">
      <div class="pl-glow" aria-hidden="true"></div>
      <div class="pl-inner">
        <ul class="pl-log" aria-hidden="true">
          <li style="animation-delay: 0.05s"><span class="pl-ok">[  OK  ]</span> Mounted /home/ayoub</li>
          <li style="animation-delay: 0.22s"><span class="pl-ok">[  OK  ]</span> Reached target network-online</li>
          <li style="animation-delay: 0.39s"><span class="pl-run" id="pl-last">[  ..  ]</span> Verifying signatures</li>
        </ul>
        <div class="pl-name" aria-hidden="true">
          <span style="animation-delay: 0.00s">A</span><span style="animation-delay: 0.06s">Y</span
          ><span style="animation-delay: 0.12s">O</span><span style="animation-delay: 0.18s">U</span
          ><span style="animation-delay: 0.24s">B</span>
        </div>
        <div class="pl-track" aria-hidden="true"><div class="pl-fill"></div></div>
        <div class="pl-meta" aria-hidden="true">
          <span class="pl-label">Decrypting</span><span class="pl-pct">0%</span>
        </div>
      </div>
    </div>

    <script>
      (function () {
        var el = document.getElementById('preloader');
        if (!el) return;
        var fill = el.querySelector('.pl-fill');
        var pct = el.querySelector('.pl-pct');
        var last = document.getElementById('pl-last');
        var reduce =
          window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // Speak the visitor's language before React is even here: the same
        // saved choice / browser preference the app's toggle starts from.
        try {
          var saved = localStorage.getItem('lang');
          var langs = navigator.languages || [navigator.language];
          var fr =
            saved === 'fr' ||
            (saved !== 'en' &&
              [].some.call(langs, function (l) {
                return /^fr/i.test(l || '');
              }));
          if (fr) {
            el.setAttribute('aria-label', 'Chargement du portfolio');
            el.querySelector('.pl-label').textContent = 'Déchiffrement';
          }
        } catch (e) {}

        // Minimum time on screen. Without it a warm cache flashes the overlay
        // for one frame, which reads as a glitch rather than an intro.
        var MIN = reduce ? 0 : 1100;
        var start = performance.now();
        var progress = 0;
        var lastFrame = start;
        var ready = false;
        var finished = false;

        function paint() {
          fill.style.transform = 'scaleX(' + progress / 100 + ')';
          pct.textContent = Math.round(progress) + '%';
        }

        // Creep toward 90% while we wait on the app. Frame-rate independent:
        // a slow device animates the same curve, just with fewer samples.
        function frame(now) {
          if (finished) return;
          var dt = now - lastFrame;
          lastFrame = now;
          // Hold at 90 until the app reports in AND the minimum is served, so
          // this agrees with complete() instead of fighting it over the snap.
          var elapsed = now - start;
          var target = ready && elapsed >= MIN ? 100 : Math.min(90, (elapsed / MIN) * 90);
          progress += (target - progress) * (1 - Math.pow(0.88, dt / 16.67));
          paint();
          requestAnimationFrame(frame);
        }

        // Completion is driven by timers, not frames, so a stalled rAF (a busy
        // main thread during boot, a weak GPU) can never strand the overlay.
        function complete() {
          if (finished) return;
          var wait = Math.max(0, MIN - (performance.now() - start));
          if (wait > 0) return setTimeout(complete, wait);
          progress = 100;
          paint();
          if (last) {
            last.textContent = '[  OK  ]';
            last.className = 'pl-ok';
          }
          setTimeout(finish, reduce ? 0 : 260); // let the full bar register
        }

        function finish() {
          if (finished) return;
          finished = true;
          el.classList.add('pl-out');
          // Hero entrance animations wait on this — otherwise the decrypt
          // plays out behind the overlay and is already a third gone by the
          // time anyone can see it.
          window.__loaded = true;
          window.dispatchEvent(new Event('app:loaded'));
          // Drop the node entirely so it can never trap clicks or focus.
          setTimeout(
            function () {
              el.parentNode && el.parentNode.removeChild(el);
            },
            reduce ? 160 : 700
          );
        }

        // App.tsx calls this once React has mounted and the fonts have settled.
        window.__appReady = function () {
          if (ready) return;
          ready = true;
          complete();
        };

        // Belt and braces: never leave the overlay up if the app fails to boot.
        window.addEventListener('load', function () {
          setTimeout(window.__appReady, 600);
        });
        setTimeout(window.__appReady, 5000);

        requestAnimationFrame(frame);
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
